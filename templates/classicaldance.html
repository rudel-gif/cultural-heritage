body{

.container{
width:90%;
margin:auto;

.grid{
display:grid;

.card{

transition:0.3s;
}

.card:hover{
transform:scale(1.05);
}

.card img {
    width: 100%;
    height: 200px;        /* fixed box height */
    object-fit: contain;  /* shows full image */
    background-color: #f5f5f5; /* optional: fills empty space */
}
.card h3{
text-align:center;
padding:10px;
color:#dea47e;
}

.details{
display:none;
background:white;
padding:30px;
margin-top:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

.gallery{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:20px;
}

.gallery img{
width:100%;
border-radius:6px;
}

button{
margin-top:20px;
padding:10px 20px;
background:#ff6600;
color:white;
border:none;
cursor:pointer;
}


    .navbar{
    padding: 10px;

.nav-buttons button:hover{

}
