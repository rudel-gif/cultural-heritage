<!DOCTYPE html>
<html>
<head>
<title>Register - Cultural Heritage of India</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background: linear-gradient(to right, #ff9933, #ffffff, #138808);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Register Container */
.register-container{
    background-color: white;
    padding: 30px;
    border-radius: 10px;
    width: 380px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    text-align: center;
}

h1{
    color: #ff6600;
    margin-bottom: 20px;
}

input{
    width: 92%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
    font-size: 16px;
}

button{
    width: 96%;
    padding: 10px;
    background-color: #138808;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
}

button:hover{
    background-color: #0f6e06;
}

.links{
    margin-top: 15px;
}

.links a{
    text-decoration: none;
    color: #0066cc;
    font-size: 14px;
}

.links a:hover{
    text-decoration: underline;
}

.footer{
    margin-top: 15px;
    font-size: 12px;
    color: gray;
}

</style>

</head>

<body>

<div class="register-container">
    <h1>Cultural Heritage of India</h1>

    <form action="/register" method="POST">

    <input type="text"
           name="full_name"
           placeholder="Full Name"
           required>

    <input type="email"
           name="email"
           placeholder="Email Address"
           required>

    <input type="text"
           name="username"
           placeholder="Username"
           required>

    <input type="password"
           name="password"
           placeholder="Password"
           required>

    <input type="password"
           name="confirm_password"
           placeholder="Confirm Password"
           required>

    <button type="submit">Register</button>

</form>

    <div class="links">
        <p>Already have an account? <a href="/login">Login Here</a></p>
        <p><a href="/index">Back to Home</a></p>
    </div>

    <div class="footer">
        <p>Preserving India's Cultural Heritage</p>
    </div>
</div>

</body>
</html>
