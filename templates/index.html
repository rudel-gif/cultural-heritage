<!DOCTYPE html>
<html>
<head>
<title>Cultural Heritage of India</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

body{
    font-family:'Poppins',sans-serif;
    margin:0;
    padding:0;
    background:linear-gradient(to bottom,#f8f4ec,#eee6d8);
    text-align:center;
}

/* NAVBAR */
.navbar{
    padding:18px 45px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#4b1d35;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
    position:sticky;
    top:0;
    z-index:100;
}

.navbar h1{
    margin:0;
    font-size:40px;
    color:white;
    font-weight:500;
    font-family: 'cinzel';
}

.nav-buttons a{
    text-decoration:none;
}

.nav-buttons button{
    padding:10px 20px;
    margin-left:10px;
    border:none;
    border-radius:8px;
    background:#c89200;
    color:white;
    cursor:pointer;
    font-size:14px;
    font-weight:500;
    transition:0.3s;
}

.nav-buttons button:hover{
    background:#a97800;
    transform:translateY(-2px);
}

/* GRID CONTAINER */
.container{
    width:80%;
    margin:50px auto;
    display:grid;
    grid-template-columns:repeat(2,500px);
    justify-content:center;
    gap:35px;
}

/* CARDS */
.card{
    position:relative;
    width:500px;
    height:280px;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 8px 22px rgba(0,0,0,0.22);
    transition:0.4s;
}

.card:hover{
    transform:translateY(-8px) scale(1.02);
}

.card img{
    width:100%;
    height:100%;
    object-fit:cover;
    filter:brightness(55%);
}

.card h3{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:34px;
    font-weight:700;
    text-shadow:2px 2px 10px black;
    margin:0;
    width:90%;
}

a{
    text-decoration:none;
}

/* MOBILE */
@media(max-width:1100px){
    .container{
        grid-template-columns:1fr;
        width:90%;
    }

    .card{
        width:100%;
    }

    .navbar{
        flex-direction:column;
        gap:10px;
    }

    .navbar h1{
        font-size:24px;
    }
}
</style>
</head>

<body>

<div class="navbar">
    <h1>HeriTales India</h1>
     <div class="navbar">

    <div class="nav-buttons">
        <a href="/">
            <button>Home</button>
        </a>

        <a href="/quiz">
            <button>Quiz</button>
        </a>

        <a href="/puzzle">
            <button>Puzzle</button>
        </a>
    </div>

</div>
   
</div>

<div class="container">

    <div class="card">
        <a href="/festivals">
            <img src="https://indiatoursimoffice.wordpress.com/wp-content/uploads/2013/11/indian-festivals.jpg">
            <h3>Festivals</h3>
        </a>
    </div>

    <div class="card">
        <a href="/classicaldance">
            <img src="https://htoindia.com/wp-content/uploads/2018/01/Indian-folk-and-tribal-dances-1.jpg">
            <h3>Classical Dance</h3>
        </a>
    </div>

    <div class="card">
        <a href="/foods">
            <img src="https://www.sodhatravel.com/hs-fs/hubfs/North%20India%20Food%20Collage.jpg?width=5120&name=North%20India%20Food%20Collage.jpg">
            <h3>Food</h3>
        </a>
    </div>

    <div class="card">
        <a href="/monuments">
            <img src="https://www.cheggindia.com/wp-content/uploads/2025/05/gk-267112-historical-monuments-in-india-v1.png">
            <h3>Monuments</h3>
        </a>
    </div>

    <div class="card">
        <a href="/folk">
            <img src="https://highonscore.com/wp-content/uploads/2021/09/folk-music-featured-image-1-2048x1158-1.jpeg">
            <h3>Folk Music</h3>
        </a>
    </div>

    <div class="card">
        <a href="/traditions">
            <img src="https://indiasdiversity.home.blog/wp-content/uploads/2019/08/traditional-values-of-india.jpg?w=1000&h=563&crop=1">
            <h3>Local Traditions</h3>
        </a>
    </div>

</div>

</body>
</html>
