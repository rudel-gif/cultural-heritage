<!DOCTYPE html>
<html>
<head>
    <title>Monuments of India</title>

    <style>
        body{
            margin: 0;
            font-family: Arial;
            background-color: #f5f5f5;
        }

        /* HEADER */
        .header{
            background: linear-gradient(to right, #ff6600, #ff3300);
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 32px;
            font-weight: bold;
        }

        /* SECTION TITLE */
        .section-title{
            font-size: 24px;
            margin: 20px;
            color: #333;
        }

        /* HORIZONTAL SCROLL */
        .scroll-container{
            display: flex;
            overflow-x: auto;
            gap: 20px;
            padding: 20px;
        }

        .card{
            min-width: 250px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: 0.3s;
        }

        .card:hover{
            transform: scale(1.05);
        }

        .card img{
            width: 100%;
            height: 180px;
            border-radius: 12px 12px 0 0;
        }

        .card h3{
            text-align: center;
            padding: 10px;
        }

        /* VERTICAL LIST */
        .grid{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
            gap: 20px;
            padding: 20px;
        }

        .grid-card{
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            overflow: hidden;
            transition: 0.3s;
        }

        .grid-card:hover{
            transform: translateY(-5px);
        }

        .grid-card img{
            width: 100%;
            height: 180px;
        }

        .grid-card h3{
            text-align: center;
            padding: 10px;
        }

        a{
            text-decoration: none;
            color: black;
        }
    </style>
</head>
