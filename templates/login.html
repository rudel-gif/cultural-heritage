<!DOCTYPE html>
<html>
<head>
<title>Login - Cultural Heritage of India</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background: linear-gradient(to right, #ff9933, #ffffff, #138808);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Login Container */
.login-container{
    background-color: white;
    padding: 30px;
    border-radius: 10px;
    width: 350px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    text-align: center;
}

h1{
    color: #ff6600;
    margin-bottom: 20px;
}

input{
    width: 90%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
    font-size: 16px;
}

button{
    width: 95%;
    padding: 10px;
    background-color: #ff6600;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
}

button:hover{
    background-color: #e65c00;
}

.links{
    margin-top: 15px;
}

.links a{
    text-decoration: none;
    color: #0066cc;
    font-size: 14px;
}

.links a:hover{
    text-decoration: underline;
}

.footer{
    margin-top: 15px;
    font-size: 12px;
    color: gray;
}

</style>

</head>

<body>

<div class="login-container">
    <h1>Cultural Heritage of India</h1>

    <form action="/login" method="POST">

    <input type="text"
           name="username"
           placeholder="Enter Username"
           required>

    <br>

    <input type="password"
           name="password"
           placeholder="Enter Password"
           required>

    <br>

    <button type="submit">Login</button>

</form>

    <div class="links">
        <p>Don't have an account? <a href="/register">Register Here</a></p>
        <p><a href="/home">Back to Home</a></p>
    </div>

    <div class="footer">
        <p>Celebrating India's Rich Culture and Traditions</p>
    </div>
</div>

</body>
</html>
