<title>Indian Culture Quiz</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial;
    background:linear-gradient(135deg,#ffecd2,#fcb69f);
    min-height:100vh;
    padding:30px;
}

/* TITLE */

.main-title{
    text-align:center;
    font-size:45px;
    color:#6a0d45;
    margin-bottom:40px;
}

/* =========================
NEW INTERACTIVE TOPICS
========================= */

.topic-section{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:35px;
    margin-top:40px;
    margin-bottom:60px;
}

.topic-card{
    position:relative;
    width:260px;
    height:320px;
    border-radius:25px;
    overflow:hidden;
    cursor:pointer;
    transition:0.5s;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* IMAGE */

.topic-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:0.5s;
}

/* OVERLAY */

.overlay{
    position:absolute;
    bottom:0;
    width:100%;
    padding:25px;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,0.8)
    );

    color:white;
}

/* TITLE */

.overlay h2{
    font-size:28px;
    margin-bottom:10px;
}

/* DESCRIPTION */

.overlay p{
    font-size:16px;
    opacity:0.9;
}

/* HOVER EFFECT */

.topic-card:hover{

    transform:
    translateY(-15px)
    scale(1.04);

    box-shadow:
    0 15px 35px rgba(0,0,0,0.35);

}

/* IMAGE ZOOM */

.topic-card:hover img{
    transform:scale(1.15);
}

/* GLOW EFFECT */

.dance-card:hover{
    box-shadow:0 0 35px #ff4081;
}

.festival-card:hover{
    box-shadow:0 0 35px #ff9800;
}

.monument-card:hover{
    box-shadow:0 0 35px #00bcd4;
}

.food-card:hover{
    box-shadow:0 0 35px #8bc34a;
}

.music-card:hover{
    box-shadow:0 0 35px #9c27b0;
}

/* FLOATING ANIMATION */

.topic-card{
    animation:float 4s ease-in-out infinite;
}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0px);
    }

}
/* LEVEL SECTION */

.level-section{
    display:none;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
    margin-bottom:40px;
}

.level-btn{
    padding:12px 20px;
    border:none;
    border-radius:30px;
    background:#6a0d45;
    color:white;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
}

.level-btn:hover{
    background:#ff5722;
}

/* QUIZ CONTAINER */

.quiz-container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 6px 20px rgba(0,0,0,0.2);
    display:none;
}

.quiz-header{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
    flex-wrap:wrap;
    gap:15px;
}

.level,
.score,
.timer,
.progress{
    font-size:18px;
    font-weight:bold;
}

/* PROGRESS BAR */

.progress-bar{
    width:100%;
    height:15px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:25px;
}

.progress-fill{
    height:100%;
    width:0%;
    background:#ff5722;
    transition:0.3s;
}

/* QUESTION */

.question{
    font-size:28px;
    margin-bottom:30px;
    font-weight:bold;
}

/* OPTIONS */

.options{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.option-btn{
    padding:16px;
    border:none;
    border-radius:12px;
    background:#f1f1f1;
    cursor:pointer;
    font-size:17px;
    transition:0.3s;
}

.option-btn:hover{
    background:#ffe0d1;
}

.correct{
    background:#4caf50 !important;
    color:white;
}

.wrong{
    background:#f44336 !important;
    color:white;
}

/* NEXT BUTTON */

.next-btn{
    margin-top:25px;
    padding:14px 30px;
    border:none;
    border-radius:50px;
    background:#ff5722;
    color:white;
    font-size:18px;
    cursor:pointer;
    display:none;
}

.next-btn:hover{
    background:#222;
}

/* RESULT */

.result{
    text-align:center;
    margin-top:30px;
    font-size:28px;
    font-weight:bold;
}

/* BADGE */

.badge{
    margin-top:20px;
    font-size:24px;
}

/* RESPONSIVE */

@media(max-width:768px){

    .main-title{
        font-size:32px;
    }

    .topic-card{
        width:150px;
        height:150px;
    }

    .question{
        font-size:22px;
    }

}

</style>
</head>

/* =========================================
VARIABLES
========================================= */

let selectedTopic = "";
let currentLevel = 1;
let currentQuestion = 0;
let score = 0;
let selectedQuestions = [];
let timer;
let timeLeft = 20;

/* =========================================
SELECT TOPIC
========================================= */

function selectTopic(topic){

    selectedTopic = topic;

    document.getElementById("levelSection").style.display="flex";

    createLevels();
}

/* =========================================
CREATE LEVELS
========================================= */

function createLevels(){

    let levelSection =
    document.getElementById("levelSection");

    levelSection.innerHTML="";

    for(let i=1;i<=15;i++){

        let btn =
        document.createElement("button");

        btn.innerHTML =
        "Level " + i;

        btn.classList.add("level-btn");

        btn.onclick = () => startQuiz(i);

        levelSection.appendChild(btn);
    }
}

/* =========================================
START QUIZ
========================================= */

function startQuiz(level){

    currentLevel = level;

    currentQuestion = 0;

    score = 0;

    document.getElementById("quizContainer")
    .style.display="block";

    document.getElementById("result")
    .innerHTML="";

    document.getElementById("badge")
    .innerHTML="";

    document.getElementById("scoreText")
    .innerHTML="Score: 0";

    // QUESTIONS

    let levelQuestions =
    questions[selectedTopic][level];

    // RANDOM QUESTIONS

    levelQuestions.sort(() =>
    Math.random() - 0.5);

    // TAKE 10 QUESTIONS

   if(levelQuestions){
    selectedQuestions =
    levelQuestions.slice(0,10);
   }else{
    alert("Questions not added for this level yet!");
    return;
    }

    loadQuestion();
}

/* =========================================
LOAD QUESTION
========================================= */

function loadQuestion(){

    clearInterval(timer);

    timeLeft = 20;

    startTimer();

    let q =
    selectedQuestions[currentQuestion];

    document.getElementById("question")
    .innerHTML = q.question;

    document.getElementById("levelText")
    .innerHTML = "Level " + currentLevel;

    document.getElementById("progressText")
    .innerHTML =
    `Question ${currentQuestion+1}/10`;

    document.getElementById("progressFill")
    .style.width =
    ((currentQuestion+1)/10)*100 + "%";

    let optionsDiv =
    document.getElementById("options");

    optionsDiv.innerHTML="";

    // RANDOMIZE OPTIONS

    q.options.sort(() =>
    Math.random() - 0.5);

    q.options.forEach(option => {

        let btn =
        document.createElement("button");

        btn.innerHTML = option;

        btn.classList.add("option-btn");

        btn.onclick = () =>
        checkAnswer(btn, option);

        optionsDiv.appendChild(btn);

    });

    document.getElementById("nextBtn")
    .style.display="none";
}

/* =========================================
CHECK ANSWER
========================================= */

function checkAnswer(button, selected){

    clearInterval(timer);

    let q =
    selectedQuestions[currentQuestion];

    let buttons =
    document.querySelectorAll(".option-btn");

    buttons.forEach(btn => {

        btn.disabled = true;

        if(btn.innerHTML === q.answer){

            btn.classList.add("correct");
        }

    });

    if(selected === q.answer){

        score++;

        document.getElementById("scoreText")
        .innerHTML = "Score: " + score;

    }else{

        button.classList.add("wrong");

    }

    document.getElementById("nextBtn")
    .style.display="inline-block";
}

/* =========================================
NEXT QUESTION
========================================= */

document.getElementById("nextBtn")
.addEventListener("click", ()=>{

    currentQuestion++;

    if(currentQuestion < 10){

        loadQuestion();

    }else{

        showResult();

    }

});

/* =========================================
TIMER
========================================= */

function startTimer(){

    document.getElementById("timer")
    .innerHTML = `⏳ ${timeLeft}s`;

    timer = setInterval(()=>{

        timeLeft--;

        document.getElementById("timer")
        .innerHTML = `⏳ ${timeLeft}s`;

        if(timeLeft <= 0){

            clearInterval(timer);

            document.getElementById("nextBtn")
            .style.display="inline-block";

        }

    },1000);
}

/* =========================================
FINAL RESULT
========================================= */

function showResult(){

    document.getElementById("question")
    .innerHTML =
    "🎉 Quiz Completed!";

    document.getElementById("options")
    .innerHTML="";

    document.getElementById("nextBtn")
    .style.display="none";

    document.getElementById("result")
    .innerHTML =
    `Your Score: ${score}/10`;

    // BADGES

    if(score >= 9){

        document.getElementById("badge")
        .innerHTML =
        "🏆 Culture Master";

    }else if(score >= 7){

        document.getElementById("badge")
        .innerHTML =
        "🌟 Quiz Champion";

    }else{

        document.getElementById("badge")
        .innerHTML =
        "🔥 Keep Practicing";

    }

}

/* =========================================
SAVE LEVEL PROGRESS
========================================= */

localStorage.setItem(
"lastLevel",
currentLevel
);
/* GO BACK HOME */

function goHome(){

    window.location.href = "/home";

}
</script>
<!-- BACK BUTTON -->

<button class="back-btn" onclick="goHome()">
    ⬅ Back To Home
</button>
</body>
